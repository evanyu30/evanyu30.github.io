<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Contact · Evan Yu</title>
    <meta name="description" content="Get in touch about security roles, research collaborations, CTF teams, or corrections to a writeup." />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Social sharing. Platforms need the full URL of the preview image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evan Yu" />
    <meta property="og:title" content="Contact · Evan Yu" />
    <meta property="og:description" content="Security roles, research collaborations, CTF teams, or a correction to a writeup." />
    <meta property="og:image" content="https://kaizeyu.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kaizeyu.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
      integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" tabindex="-1">
      <section class="page-head" aria-labelledby="contact-title">
        <div class="bg-glow" aria-hidden="true"></div>
        <div class="container contact-layout">
          <div class="contact-intro" data-copy-scope>
            <p class="eyebrow reveal"><span class="eyebrow-mark" aria-hidden="true">//</span> <span data-slot="contact-eyebrow"></span></p>
            <h1 class="page-title reveal" id="contact-title" data-slot="contact-headline" style="--delay: 80ms"></h1>
            <p class="hero-sub reveal" data-slot="contact-intro" style="--delay: 160ms"></p>

            <div class="contact-direct reveal" style="--delay: 240ms">
              <p class="contact-label">Or email directly</p>
              <div class="email-row">
                <a class="email-link" data-slot="email-link" href="contact.html"></a>
                <button class="copy-btn" type="button" data-action="copy-email">
                  <i class="ph ph-copy" aria-hidden="true"></i>
                  <span>Copy</span>
                </button>
              </div>
              <p class="field-hint" data-slot="copy-status" role="status"></p>
            </div>

            <ul class="social-list reveal" data-slot="social" aria-label="Profiles elsewhere"></ul>
          </div>

          <form class="contact-form form-card reveal" novalidate data-slot="form" style="--delay: 200ms">
            <div class="form-bar" aria-hidden="true">
              <span class="terminal-dots"><span></span><span></span><span></span></span>
              <span class="terminal-name">new message</span>
            </div>
            <fieldset class="topic-field">
              <legend>What is this about?</legend>
              <div class="topic-options" data-slot="contact-topics"></div>
            </fieldset>
            <div class="field-row">
              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-err" />
                <p class="field-error" id="f-name-err"></p>
              </div>
              <div class="field">
                <label for="f-email">Email</label>
                <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="f-email-err" />
                <p class="field-error" id="f-email-err"></p>
              </div>
            </div>
            <div class="field">
              <label for="f-message">Message</label>
              <textarea id="f-message" name="message" rows="7" required aria-describedby="f-message-err"></textarea>
              <p class="field-error" id="f-message-err"></p>
            </div>
            <div class="form-foot">
              <p class="form-note">Opens your email app with the message ready. Nothing is sent until you hit send.</p>
              <button class="btn btn-primary" type="submit">
                <span data-slot="contact-submit"></span>
                <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
              </button>
            </div>
            <div class="form-status" data-slot="form-status" role="status" hidden></div>
            <p class="disclosure"><i class="ph ph-shield-check" aria-hidden="true"></i><span><span data-slot="contact-disclosure"></span> <a href="/.well-known/security.txt">security.txt</a>.</span></p>
          </form>
        </div>
      </section>
    </main>

    <noscript><p class="noscript">The form needs JavaScript. You can still email hi@kaizeyu.com directly.</p></noscript>
    <script src="content.js"></script>
    <script src="main.js" defer></script>
  </body>
</html>
