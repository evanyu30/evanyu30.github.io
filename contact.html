<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · Evan Yu</title>
  <meta name="description" content="Questions, corrections, or ideas about AI infrastructure? Get in touch with Evan Yu." />
  <meta name="theme-color" content="#f3ede3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contact · Evan Yu" />
  <meta property="og:description" content="Questions, corrections, or ideas about AI infrastructure." />
  <meta property="og:image" content="og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" tabindex="-1">
    <section class="page-head" aria-labelledby="contact-title">
      <div class="container contact-layout">
        <div class="contact-intro" data-copy-scope>
          <p class="eyebrow reveal" data-slot="contact-eyebrow"></p>
          <h1 class="hero-title reveal" id="contact-title" data-slot="contact-headline" style="--delay: 80ms"></h1>
          <p class="hero-sub reveal" data-slot="contact-intro" style="--delay: 160ms"></p>

          <div class="contact-direct reveal" style="--delay: 240ms">
            <p class="contact-label">Or email me directly</p>
            <div class="email-row">
              <a class="email-link" data-slot="email-link" href="contact.html"></a>
              <button class="copy-btn" type="button" data-action="copy-email">
                <i class="ph ph-copy" aria-hidden="true"></i>
                <span>Copy</span>
              </button>
            </div>
            <p class="field-hint" data-slot="copy-status" role="status"></p>
          </div>

          <ul class="social-list reveal" data-slot="social" aria-label="Elsewhere"></ul>
        </div>

        <form class="contact-form form-card reveal" novalidate data-slot="form" style="--delay: 200ms">
          <fieldset class="topic-field">
            <legend>What is it about?</legend>
            <div class="topic-options" data-slot="contact-topics"></div>
          </fieldset>
          <div class="field-row">
            <div class="field">
              <label for="f-name">Your name</label>
              <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-err" />
              <p class="field-error" id="f-name-err"></p>
            </div>
            <div class="field">
              <label for="f-email">Your email</label>
              <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="f-email-err" />
              <p class="field-error" id="f-email-err"></p>
            </div>
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" rows="7" required aria-describedby="f-message-err"></textarea>
            <p class="field-error" id="f-message-err"></p>
          </div>
          <div class="form-foot">
            <p class="form-note">Opens your email app, ready to send.</p>
            <button class="btn btn-primary" type="submit">
              <span data-slot="contact-submit"></span>
              <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
            </button>
          </div>
          <div class="form-status" data-slot="form-status" role="status" hidden></div>
        </form>
      </div>
    </section>
  </main>

  <noscript><p class="noscript">The form needs JavaScript.</p></noscript>
  <script src="content.js"></script>
  <script src="main.js" defer></script>
</body>
</html>
